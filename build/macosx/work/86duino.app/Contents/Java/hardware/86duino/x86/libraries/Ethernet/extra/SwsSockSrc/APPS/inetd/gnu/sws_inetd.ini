; APPLICATIONS
;==============

[smtp]
UpnpExtPort=25
;log = 0
max_conn= 4    ; Default 3
idle_time = 15 ; Seconds, default 120
maxsize= 20000000 ; 0= unlimited

;hostname = mail
;greeting=Welcome ; default ESMTP
;bye=Bye ; default closing

deny_defer= 1 ;1
deny_unnamed= 1 ;0
;deny_badhello= 1 ;0
deny_dynamicip= 1 ; 0
;verify_sender=1

; The MX to always use for relaying
; Blank or absent to use [smtp_mx] entries followed by default_mx then DNS
;relay_mx=smtp.neuf.fr

; The default MX for relaying
; Blank or absent to use DNS MX
;default_mx=smtp.neuf.fr
;default_mx=user:passwd+myisp.com

[smtp_permit]
; Host IPs unconditionally permitted
ip4= 127.0.0.1
ip4= 192.168.1.0/24

[smtp_deny]
; Host IPs denied login
ip4= 192.168.1.1

[smtp_banned_hosts]
; hostnames banned at HELO. may contain * and ?
hostname= localhost
hostname= *.in-addr.arpa

[smtp_mail_names]
; hostnames that are known not to be dynamic. may contain * and ?
*smtp*
*mail*

[smtp_dynamic_names]
; lowercase hostname fragments that add to dynamic name rating
dynamic
dialup
dialin
ppp
pool
adsl
cable
dhcp

[smtp_static_names]
; lowercase hostname fragments that subtract from dynamic name rating
static
mta

[smtp_banned_sender]
; mail from these senders is blocked, may contain * and ?
*@localhost

[smtp_relay]
; Host IPs permitted to relay
ip4= 192.168.1.0/24
ip4= 127.0.0.1

[smtp_mx]
; Domains with special handling
; Blank to use DNS MX
; Absent to use default_mx
;neuf.fr=
;ntlworld.com= smtp.neuf.fr

[smtp_users]
;mailbox                   inbox                           quota
Postmaster                 ./inbox/postmaster            1000000
@localhost                 ./inbox/all                   1000000


[pop]
UpnpExtPort=110
;log = 0
max_conn = 3    ; Default 4
idle_time = 300 ; Seconds, default 120
;greeting=
;bye=

[pop_users]
;username      password        inbox
;
admin          admin          ./inbox/postmaster
user           user           ./inbox/all


[ftp]
UpnpExtPort=21
;log = 0
max_conn = 6
;idle_time = 900 ; default 180

[ftp_users]
;username      password   home_dir      permit [r|x|w|c]  permitted host(s)

admin          admin      .                   c           192.168.1.20/28
webmaster      secret     ./www               c           192.168.1.20/28
anonymous      *          ./www               x
ftpuser        -          ./ftp               r
*              *          ./ftp               w


[telnet]
UpnpExtPort=23
;log = 0
max_conn = 3

[telnet_users]
;username      password   home_dir       permit [r|w|c]   permitted host(s)

admin          admin      .                   c           192.168.1.20/28
anonymous      *          ./ftp               w
guest          -          ./ftp               w
*              -          ./ftp               r


[http]
UpnpExtPort=80
;log = 0
max_conn = 16 ; 4
idle_time = 60 ; 120 secs
keep_time = 3; 2 secs

root = ./www
html_root = /public
cgi_root = /cgi-bin

; URI's requiring authentication
authorize = /private/* http_private

[http_alias]
; The lhs & rhs may contain * and ? wildcards
; NB these must be in order of precedence
/ = /index.htm

; PHP scripts in doc folder
/cgi-bin/*.php = /cgi-bin/*.php
/?*.php = /cgi-bin/php.cgi/*.php
; Perl scripts in doc folder
/cgi-bin/*.pl = /cgi-bin/*.pl
/?*.pl = /cgi-bin/perl.cgi/*.pl

; directory listing
/?*/ = /cgi-bin/dir.cgi/*/

; absolute URI remapping
http://www.myhost.com/* = /*
http://www.myhost.com:80/* = /*

[http_files]
*.xml = text/xml
*.bz2 = application/x-tar
*.diff = text/plain
*.bat = text/plain

[http_redirect]
; 301 (moved permanently) client redirects
/index.html = /index.htm

[http_admin]
; Authorization for put & delete methods
text = Access restricted
permit = 127.0.0.1
permit = 192.168.1.0/24
;acct = user:password

[http_proxy]
; Authorization for all proxy requests
text = Proxy use restricted
; Enable public proxy service overnight
time = 21:30 08:30
acct = user:password

permit = 127.0.0.1
permit = 192.168.1.0/24

; blacklist
deny = 74.63.0.0/16 ; Limestone Networks - multiple ad requests
deny = 69.162.0.0/16 ; Limestone Networks

[http_cgi]
; Authorization for CGI's in /cgi-bin/nph_*
text = CGI access restricted
;acct = user:password
permit = 127.0.0.1/16
permit = 192.168.1.0/22

[http_private]
; Custom private area
path = /private
text = Private area
acct = user:password
permit = 127.0.0.1
;permit = 192.168.1.0/22


[echo]
UpnpExtPort = 7
;log = 0
; max_conn= 3
idle_time= 30 ; Seconds, default 120


[discard]
UpnpExtPort = 9
;log = 0
; max_conn= 3
idle_time= 30 ; Seconds, default 120


[ident]
UpnpExtPort = 113
;log = 0
;max_conn = 3
idle_time = 60 ; Seconds, default 120
user = anonymous


[inetd]
; ports, 0= disable
;ftp= 0
;telnet= 0
;smtp= 0
;http= 0
;pop= 0
;echo= 0
;discard= 0
;ident= 0
